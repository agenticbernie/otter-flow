services:
  # --- Backend (FastAPI) ---
  - type: web
    name: otter-flow-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLERK_ISSUER
        value: https://witty-hen-2776.clerk.accounts.dev
      - key: CLERK_JWKS_URL
        value: https://witty-hen-2776.clerk.accounts.dev/.well-known/jwks.json
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://otterflow.hackon.team,https://api.otterflow.hackon.team
      - key: GITHUB_CLIENT_ID
        value: Iv23ligQJGXQj6msQoSC
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_SLUG
        value: otter-flow
      - key: GITHUB_CALLBACK_URL
        value: https://api.otterflow.hackon.team/api/github/callback
      - key: FRONTEND_URL
        value: https://otterflow.hackon.team
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  # --- Frontend (CRA + CRACO Static Site) ---
  - type: web
    name: otter-flow-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://api.otterflow.hackon.team
      - key: REACT_APP_CLERK_PUBLISHABLE_KEY
        value: pk_test_d2l0dHktaGVuLTI3NzYuY2xlcmsuYWNjb3VudHMuZGV2JA
      - key: NODE_VERSION
        value: 20.11.0
